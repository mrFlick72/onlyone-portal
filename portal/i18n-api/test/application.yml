server:
  port: 5060

cors:
  allowed:
    origins: http://local.onlyone-portal.com:8070

idp:
  jwks-endpoint: http://local.api.vauthenticator.com:9090/oauth2/jwks

user:
  required-role: i18n_READER

i18n:
  default-language: en_en
  jwt:
    language-claim: preferred_language
  s3:
    bundle:
      bucket-name: onlyone-portal-i18n-test

logger:
  level: info
  file-name: log.log
