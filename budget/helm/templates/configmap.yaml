apiVersion: v1
kind: ConfigMap
metadata:
  name: budget-api-config
  namespace: {{ .Release.Namespace }}
data:
  application.yml: |
    {{- if .Values.application.aws.dynamodbEndpoint }}
    aws:
      dynamodb:
        endpointOverride: {{ .Values.application.aws.dynamodbEndpoint }}
    {{- end }}

    cors:
      allowedOrigins: {{ .Values.application.corsAllowedOrigins }}

    granted-role:
      budget-api: {{ .Values.application.allowedRole }}

    spring:
      profiles:
        active: kubernetes
      data:
        redis:
          host: {{ .Values.application.redis.host }}
      main:
        lazy-initialization: true

      security:
        oauth2:
          resourceserver:
            jwt:
              jwk-set-uri: ${vauthenticator.host}/oauth2/jwks

    server:
      port: 8080
      servlet:
        context-path: /
      compression:
        enabled: true
        min-response-size: 1KB

    management:
      server:
        port: 8081
        servlet:
          context-path: /
      endpoints:
        web:
          exposure:
            include: "*"
      endpoint:
        probes:
          enabled: true
        shutdown:
          enabled: true
        health:
          show-details: ALWAYS

    vauthenticator:
      host: {{ .Values.application.vauthenticator.host }}

    budget-api:
      dynamo-db:
        search-tags:
          table-name: {{ .Values.application.dynamoDb.searchTags.tableName }}
          cache-name: {{ .Values.application.dynamoDb.searchTags.cacheName }}
          cache-ttl: {{ .Values.application.dynamoDb.searchTags.cacheTtl }}
        budget-expense:
          table-name: {{ .Values.application.dynamoDb.budgetExpense.tableName }}
        budget-revenue:
          table-name: {{ .Values.application.dynamoDb.budgetRevenue.tableName }}