apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "budget-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
  {{- include "budget-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
      {{- with .Values.labels }}
      {{- toYaml .Values.labels | nindent 8 }}
      {{ end }}
    {{- include "budget-api.selectorLabels" . | nindent 8 }}
    spec:
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: application-config
          configMap:
            name: budget-api-config

      containers:
        - name: {{ .Chart.Name }}
          volumeMounts:
            - name: application-config
              subPath: application.yml
              mountPath: /usr/local/onlyone-portal/config/application.yml

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
            - containerPort: 8081
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: {{ .Values.pod.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.pod.probes.liveness.periodSeconds }}

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: {{ .Values.pod.probes.rediness.initialDelaySeconds }}
            periodSeconds: {{ .Values.pod.probes.rediness.periodSeconds }}
          resources:
          {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: AWS_ACCESS_KEY_ID
              value: {{ .Values.application.aws.accessKey }}

            - name: AWS_SECRET_ACCESS_KEY
              value: {{ .Values.application.aws.secretKey }}

            - name: AWS_REGION
              value: {{ .Values.application.aws.region }}

            - name: spring.config.additional-location
              value: /usr/local/onlyone-portal/config/