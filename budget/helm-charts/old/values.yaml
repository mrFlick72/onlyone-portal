replicaCount: 1

image:
  repository: "891376948757.dkr.ecr.eu-central-1.amazonaws.com/onlyone-portal/budget-api"
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

labels: {}


pod:
  probes:
    liveness:
      initialDelaySeconds: 10
      periodSeconds: 10
    rediness:
      initialDelaySeconds: 10
      periodSeconds: 10

service:
  type: ClusterIP
ingress:
  enabled: false
  className: ""
  annotations: {}
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  host: chart-example.local
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
#   memory: 128Mi
# requests:
#   cpu: 100m
#   memory: 128Mi

application:
  aws:
    region: xxxx
    accessKey: xxxx
    secretKey: xxxx
    dynamodbEndpoint:
  allowedRole: BUDGET
  corsAllowedOrigins: http://localhost
  dynamoDb:
    searchTags:
      tableName: TableName
      cacheName: CacheName
      cacheTtl: 1000
    budgetExpense:
      tableName: TableName
    budgetRevenue:
      tableName: TableName
  vauthenticator:
    host: http://localhost

  redis:
    host: http://redis

redis:
  metrics:
    enabled: true
  auth:
    enabled: false
  master:
    resources:
      limits:
        memory: "512Mi"

    persistence:
      enabled: false

  replica:
    resources:
      limits:
        memory: "512Mi"
    replicaCount: 1
    persistence:
      enabled: false
