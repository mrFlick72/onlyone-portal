version: "3.8"

services:
  localstack:
    #    container_name: "${LOCALSTACK_DOCKER_NAME-localstack_main}"
    image: localstack/localstack:3.2
    ports:
      - "4566-4599:4566-4599"
      - "${PORT_WEB_UI-8050}:${PORT_WEB_UI-8080}"
    environment:
      - PERSISTENCE=1
      - SERVICES=dynamodb
    volumes:
      - ./localstack:/var/lib/localstack
