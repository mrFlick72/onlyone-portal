server:
  port: 3050
  
cors:
  allowed:
    origins: http://local.onlyone-portal.com:8070

idp:
  jwks-endpoint: http://local.api.vauthenticator.com:9090/oauth2/jwks

user:
  required-role: USER_ROLE

logger:
  level: info
  file-name: logs.log

tag-api:
  base-url: http://local.tag-api.onlyone-portal.com:8000

budget-api:
  dynamo-db:
    attachment-metadata:
      table-name: BUDGET_ATTACHMENT_METADATA
  s3:
    attachment:
      bucket-name: budget-attachment-staging