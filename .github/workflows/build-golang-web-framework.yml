name: build GoLang Web Framework (the base foundation for golang apps of OnlyOne Portal)

on:
  push: { }
  workflow_dispatch: {}

jobs:
  build-golang-web-framework:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core-services/golang-web-framework
    services:
      localstack:
        image: localstack/localstack:4.14
        ports:
          - "4566-4599:4566-4599"
        env:
          SERVICES: kms
    steps:
      - name: checkout
        uses: actions/checkout@v6
      
      - name: Set up Golang
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.1

      - name: Build golang-web-framework package
        run: |
          go build -o golang-web-framework .

      - name: Run tests
        run: |
          go test -tags test ./...

      - name: Run integration tests (Docker-backed, e.g. testcontainers redis)
        run: |
          go test -tags "test integration" ./cache/redis/...