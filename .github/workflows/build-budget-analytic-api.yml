name: build Budget Analytic API

on:
  push: { }
  workflow_dispatch: {}

jobs:
  build-budget-analytic-api:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: budget/analytic-api
    services:
      localstack:
        image: localstack/localstack:3.2
        ports:
          - "4566-4599:4566-4599"
        env:
          SERVICES: dynamodb,s3
      kafka:
        image: apache/kafka:4.1.0
        ports:
          - "9092:9092"
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          # Tests create their topics explicitly via kadm, so auto-create is off
          # to keep CI honest about that independence.
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Build and Test
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        run: |
          python3 -m venv venv && source venv/bin/activate
          pip install -e ".[dev]"
          pytest